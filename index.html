<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<h2>Получить чисчло</h2>

<button id="btn">Получить</button>
<div id="res"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();

const API_URL = "https://lands-lafayette-packs-brook.trycloudflare.com/number";

document.getElementById("btn").onclick = async () => {
  const res = document.getElementById("res");

  try {
    res.innerText = "Загрузка...";

    const r = await fetch(API_URL);

    if (!r.ok) {
      throw new Error("HTTP " + r.status);
    }

    const data = await r.json();

    res.innerText = "Число: " + data.number;

  } catch (e) {
    console.error(e);
    res.innerText = "Ошибка соединения";
  }
};
</script>

</body>
</html>
